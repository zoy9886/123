 {time:'08:00',place:'豐譽・辦公室入口',img:'hr',who:'HR 學姊｜依庭',tag:'FIRST DAY',lines:[['旁白','早上八點。你比約定時間早到了十分鐘，站在陌生的辦公室門口。'],['HR 學姊｜依庭','早安！你是今天來報到的實習生嗎？歡迎加入我們！'],['HR 學姊｜依庭','我先去準備你的資料，你可以稍微熟悉一下環境。']],question:'你還不知道接下來該去哪裡，會先怎麼做？',choices:[['G','直接找一位同仁問：「不好意思，我可以先做什麼？」'],['R','拿出報到通知，確認流程和集合地點。'],['S','先觀察大家的動線，找出負責接待的人。'],['H','仔細看看周圍的指示，確認自己沒有漏掉資訊。']],replies:{G:'依庭笑了：「很棒！有問題直接問，真的比站著緊張有效。」',R:'依庭點點頭：「你很會先整理資訊耶，等等我也會給你流程表。」',S:'依庭說：「觀察力很好！你已經找到我們的報到區了。」',H:'依庭笑著說：「你連小細節都注意到了，真可靠。」'}},
 {time:'09:15',place:'工程辦公區・圖面桌',img:'mentor',who:'施工學長｜子軒',tag:'BLUEPRINTS',lines:[['旁白','辦公桌上攤開一疊施工圖，螢幕裡還有你看不懂的工程模型。'],['施工學長｜子軒','欸，新同學！剛好，幫我整理一下這批工程資料好嗎？'],['施工學長｜子軒','不用緊張，沒有人第一天就看得懂全部。']],question:'面對一疊看不懂的工程資料，你的第一步是？',choices:[['G','先動手翻翻看，找出自己可以處理的部分。'],['R','問清楚整理這些資料的目的與最後要交什麼。'],['S','先確認哪些資料最重要、弄錯可能影響什麼。'],['H','確認命名、排序和版本，避免整理完還要重做。']],replies:{G:'子軒：「很可以！邊做邊學，現場就是這樣累積經驗的。」',R:'子軒：「問得好，知道為什麼要做，才知道怎麼做。」',S:'子軒：「你想得很周全，圖面版本錯了真的會很麻煩。」',H:'子軒：「太好了，工程資料最怕版本混在一起。」'}},
 {time:'10:30',place:'茶水間',img:'admin',who:'行政同仁｜宥庭',tag:'COFFEE BREAK',lines:[['行政同仁｜宥庭','救命！大家要一起訂飲料，但每個人的要求都不一樣。'],['行政同仁｜宥庭','有人少冰、有人無糖，還有人說「跟上次一樣」……你有什麼好方法？']],question:'面對一團混亂的飲料訂單，你會？',choices:[['H','先確認每個人的品項和甜度冰塊，避免訂錯。'],['G','直接推薦一家大家都沒喝過、評價很好的店。'],['S','先問清楚有沒有不能喝的成分或特殊需求。'],['R','做一張簡單的表單，讓每個人自己填清楚。']],replies:{H:'宥庭：「太感動了，終於有人懂訂錯飲料的痛！」',G:'宥庭：「哈哈，原來你是敢帶大家嘗鮮的那個！」',S:'宥庭：「你真的有注意到每個人的需求耶。」',R:'宥庭：「這招很聰明！以後訂飲料都交給這張表了。」'}},
 {time:'12:30',place:'午休・員工休息區',img:'admin',who:'行政同仁｜宥庭',tag:'LUNCH TALK',lines:[['旁白','午餐時間，大家終於暫時放下手邊的工作。'],['行政同仁｜宥庭','我問你喔，如果先不考慮薪水，你會想做什麼樣的工作？'],['行政同仁｜宥庭','不要想標準答案，說你真正喜歡的就好。']],question:'你最期待工作帶給你哪種感覺？',choices:[['G','遇到挑戰，親手把原本做不到的事完成。'],['R','每天都能學到新東西，解開複雜的問題。'],['S','提早發現問題，讓大家可以安心把事情做好。'],['H','把每個細節顧好，讓成果真的值得信賴。']],replies:{G:'宥庭：「你應該很適合那種每天都有新挑戰的現場。」',R:'宥庭：「懂！把一件複雜的事想通，真的很有成就感。」',S:'宥庭：「讓事情順利進行，也是很厲害的能力。」',H:'宥庭：「我喜歡這個答案，可靠真的很難得。」'}},
 {time:'13:15',place:'工地入口・圍籬旁',img:'cat',who:'工地橘貓｜？？？',tag:'A LITTLE SURPRISE',lines:[['旁白','準備進工地時，一團橘色的影子突然出現在圍籬旁。'],['工地橘貓｜？？？','喵。'],['旁白','牠一臉理所當然地看著你，彷彿自己才是今天的工地主任。']],question:'面對這位神秘的「監工」，你會？',choices:[['CAT','先確認牠待的位置是否安全，再找同仁協助。'],['CAT','拿起手機拍一張照片，紀念第一天。'],['CAT','好奇地問學長：「牠每天都會來嗎？」'],['CAT','在心裡幫牠取名：「橘色總監」。']],replies:{CAT:'橘貓瞇起眼睛，彷彿對你的決定表示批准。喵。'}},
 {time:'14:00',place:'工程現場・施工區',img:'safety',who:'職安學姊｜佳穎',tag:'ON SITE',lines:[['旁白','戴上安全帽、穿好反光背心，你第一次走進真正的工程現場。'],['職安學姊｜佳穎','這裡跟你想像的一樣嗎？每個人看現場，注意到的事情都不一樣。'],['職安學姊｜佳穎','如果讓你先觀察十分鐘，你會最想弄懂什麼？']],question:'進入工地後，你最先被什麼吸引？',choices:[['G','眼前的結構到底是怎麼一步步蓋起來的。'],['R','圖面、進度和不同工種之間怎麼互相配合。'],['S','現場哪些地方可能有風險、要怎麼預防。'],['H','已經完成的部分，怎麼確認有達到要求。']],replies:{G:'佳穎：「那等等可以請子軒帶你看看施工順序！」',R:'佳穎：「工程就像大型拼圖，每一塊都要接得起來。」',S:'佳穎：「你很有職安的直覺，先看到風險很重要。」',H:'佳穎：「完成不代表合格，這個觀察很專業喔。」'}},
 {time:'15:10',place:'工程現場・圖面查核',img:'quality',who:'品管學姊｜筱妤',tag:'SOMETHING CHANGED',lines:[['品管學姊｜筱妤','等一下，這裡的施工情況好像跟原本規劃的不太一樣。'],['品管學姊｜筱妤','先別急著下結論，我們一起想想接下來該怎麼確認。']],question:'發現現場和原本計畫不同，你會先？',choices:[['G','到現場把狀況看清楚，找出可以怎麼處理。'],['R','把圖面和現場資料放在一起，比對差異。'],['S','確認這個變動會不會影響安全或後續作業。'],['H','檢查施工要求和驗收標準，確認差異是否可接受。']],replies:{G:'筱妤：「先把現況看清楚，才能討論可行做法。」',R:'筱妤：「很好，差異要有依據，不能只靠印象。」',S:'筱妤：「沒錯，變更前要先想它會影響到誰。」',H:'筱妤：「這就是品質管理的重要觀念，標準不能憑感覺。」'}},

const HOUSES={G:{name:'施工組',title:'現場行動派',lead:'你擅長把「我們可以試試看」變成「我們真的做到了」。',detail:'施工工程師就像工程現場的指揮家：確認進度、協調不同工種、解決突發狀況，讓圖紙上的線條一步步變成真正的建築。每天的現場都不太一樣，喜歡動手解決問題的人，通常會在這裡找到成就感。',daily:'跟學長姐巡現場、看施工進度、拍攝紀錄、認識模板與鋼筋等工項。',icon:'🏗️'},R:{name:'規劃組',title:'藍圖解碼師',lead:'你擅長把一團複雜的資訊，整理成大家都看得懂的下一步。',detail:'規劃不是坐在辦公室空想！工程師要讀懂圖面、安排進度、協調不同專業，也可能接觸 BIM 模型和數位工具。就像在大型拼圖還沒完成前，先看出每一塊應該放在哪裡。',daily:'跟著看工程圖、整理進度資料、比較設計圖與現場資訊，認識 BIM 模型。',icon:'📐'},S:{name:'職安組',title:'風險偵測員',lead:'你比別人早一步看見風險，也願意替團隊多想一步。',detail:'職安工程師不是只會提醒大家戴安全帽，而是要辨識危害、規劃防護、巡查現場，和各單位一起找到更安全的作業方式。你守護的不是規定本身，而是每個人都能平安下班。',daily:'跟著進行安全巡查、觀察防護措施、認識施工風險和職安教育。',icon:'🦺'},H:{name:'品管組',title:'細節守護者',lead:'你相信真正厲害的成果，是經得起仔細檢查的。',detail:'品管工程師像工程的細節偵探：確認材料、施工方法與成果是否符合圖說和規範，安排檢驗、留下紀錄，發現不符合要求的地方就一起找改善方法。讓每個細節都成為值得信任的品質。',daily:'學習看查驗表、認識材料試驗、跟著現場檢查、整理品質紀錄。',icon:'🔎'}};
let idx=0,step=0,mode='start',score={G:0,R:0,S:0,H:0},cat=false,chosen=[],player='你',typing=false,full='',typingTimer=null,audio=null,musicOn=false,musicTimer=null;
const $=id=>document.getElementById(id);
function scene(){let s=STORIES[idx];$('bg').style.backgroundImage=`url("${IMG[s.img]}")`;$('portrait').style.backgroundImage=`url("${IMG[s.img]}")`;$('portrait').className='portrait'+(s.img==='cat'?' cat':'');$('clock').textContent=s.time;$('place').textContent=s.place;$('sceneTag').textContent=s.tag;$('rain').classList.toggle('active',s.img==='rain');$('progressBar').style.width=`${(idx/9)*100}%`;step=0;mode='dialog';$('options').innerHTML='';nextLine();}
function typeText(txt){clearInterval(typingTimer);full=txt;typing=true;$('line').textContent='';$('hint').textContent='點擊顯示完整對話 ▾';$('portrait').classList.add('talking');let i=0;typingTimer=setInterval(()=>{i=Math.min(txt.length,i+2);$('line').textContent=txt.slice(0,i);if(i>=txt.length)finishTyping();},24);}
function finishTyping(){clearInterval(typingTimer);typing=false;$('line').textContent=full;$('hint').textContent=mode==='reply'?'點擊繼續 ▾':'點擊繼續 ▾';$('portrait').classList.remove('talking');}
function nextLine(){let s=STORIES[idx];if(step<s.lines.length){const [speaker,line]=s.lines[step++];$('speaker').textContent=speaker;typeText(line);}else showQuestion();}
function showQuestion(){mode='question';let s=STORIES[idx];$('speaker').textContent=s.who;$('line').textContent=s.question;$('hint').textContent='選擇你最直覺的答案';$('options').innerHTML='';s.choices.forEach(([key,label],i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${String.fromCharCode(65+i)}</b><span></span>`;b.querySelector('span').textContent=label;b.addEventListener('click',()=>choose(key));$('options').append(b);});}
function choose(key){if(mode!=='question')return;let s=STORIES[idx];chosen.push(key);if(key==='CAT'){cat=true;}else score[key]++;mode='reply';$('options').innerHTML='';$('speaker').textContent=s.who;typeText(s.replies[key]||'原來你是這樣想的！');}
function advance(){if(typing){finishTyping();return;}if(mode==='dialog'){nextLine();return;}if(mode==='reply'){idx++;if(idx>=STORIES.length){showResult();return;}let f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');scene();}}
function showResult(){mode='result';$('dialogue').hidden=true;$('top').hidden=true;$('progress').hidden=true;$('portrait').hidden=true;$('sceneTag').hidden=true;$('rain').classList.remove('active');let sorted=Object.keys(score).sort((a,b)=>score[b]-score[a]||['G','R','S','H'].indexOf(a)-['G','R','S','H'].indexOf(b));let main=sorted[0],second=sorted[1],total=Object.values(score).reduce((a,b)=>a+b,0);let m=HOUSES[main];let stats=sorted.map(k=>`<div class="stat"><span>${HOUSES[k].name}</span><div class="bar"><i style="width:${total?score[k]/total*100:0}%"></i></div><b>${total?Math.round(score[k]/total*100):0}%</b></div>`).join('');let e=$('end');e.hidden=false;e.innerHTML=`<div class="eyebrow">YOUR FIRST DAY · COMPLETED</div><h1>${escapeHtml(player)}，今天辛苦了！</h1><p>從陌生的辦公室到傍晚的工地，你的第一天結束了。<br>原來工程現場，也有一種很適合你的角色。</p><div class="result-card"><div style="font-size:42px">${m.icon}</div><div class="result-name">${m.name}</div><div class="result-title">你的工程特質｜${m.title}</div><p style="font-weight:750;color:#ffebc6">${m.lead}</p><h3>這個組別，到底在忙什麼？</h3><p>${m.detail}</p><h3>如果明天真的來實習……</h3><p>${m.daily}</p><h3>你的第二特質</h3><p>${HOUSES[second].icon} ${HOUSES[second].name}・${HOUSES[second].title}。你不只有一種可能，兩種能力也可能一起發揮！</p><h3>你的特質分布</h3><div class="stats">${stats}</div>${cat?'<div class="note">🐈 橘色總監認證：你今天成功遇見工地神秘橘貓！</div>':''}</div><p>這是一場輕鬆的探索遊戲，不是正式的職涯測評。分院只是開始，未來的方向，由你自己決定。</p><button class="primary" id="copyResult">分享我的工程特質 ↗</button><button class="ghost" id="again">再體驗一次不同選擇 ↺</button>`; $('copyResult').onclick=()=>{let text=`我的工程實習第一天，最像${m.name}的「${m.title}」！第二特質是${HOUSES[second].name}。你也來試試看！`;if(navigator.share)navigator.share({title:'我的第一天，從這裡開始',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('已複製結果文字！')).catch(()=>prompt('複製以下文字：',text));else prompt('複製以下文字：',text);};$('again').onclick=reset;}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function reset(){clearInterval(typingTimer);idx=0;step=0;score={G:0,R:0,S:0,H:0};cat=false;chosen=[];mode='start';$('start').hidden=false;$('end').hidden=true;$('top').hidden=true;$('progress').hidden=true;$('dialogue').hidden=true;$('portrait').hidden=false;$('sceneTag').hidden=false;stopMusic();}
$('startBtn').addEventListener('click',()=>{player=$('playerName').value.trim()||'你';$('start').hidden=true;$('top').hidden=false;$('progress').hidden=false;$('dialogue').hidden=false;idx=0;scene();});$('bubble').addEventListener('click',advance);$('bubble').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}});$('restart').onclick=()=>{if(confirm('要重新開始今天的故事嗎？'))reset();};
// Gentle optional soundtrack: quiet sine/triangle chords, no harsh repetitive beeps.
function musicTick(){if(!musicOn||!audio)return;let t=audio.currentTime+0.05;let seq=[0,4,7,11,7,4,2,7];let n=seq[Math.floor(t*1.2)%seq.length];let base=idx>=7?196:idx>=5?220:261.63;[0,7,12].forEach((iv,j)=>{let osc=audio.createOscillator(),gain=audio.createGain(),lp=audio.createBiquadFilter();osc.type=j===0?'sine':'triangle';osc.frequency.value=base*Math.pow(2,(n+iv)/12);lp.type='lowpass';lp.frequency.value=780;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(j===0?.013:.004,t+.09);gain.gain.exponentialRampToValueAtTime(.0001,t+1.3);osc.connect(lp);lp.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+1.4);});}
function stopMusic(){musicOn=false;$('music').textContent='♫';if(musicTimer)clearInterval(musicTimer);musicTimer=null;if(audio){audio.close().catch(()=>{});audio=null;}}
$('music').onclick=()=>{if(musicOn){stopMusic();return;}try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();musicOn=true;$('music').textContent='♪';musicTick();musicTimer=setInterval(musicTick,1500);}catch(e){alert('這個瀏覽器無法播放背景音樂。');}};
// Initial art for title screen
$('bg').style.backgroundImage=`url("${IMG.mentor2}")`;
</script></body></html>
